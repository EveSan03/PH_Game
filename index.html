<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Super Medix: Salud Pública Bros</title>
  <style>
    * { 
      box-sizing: border-box; 
      touch-action: manipulation;
      -webkit-touch-callout: none;
      -webkit-user-select: none;
      user-select: none;
    }
    body {
      margin: 0;
      padding: 0;
      background-color: #121212;
      color: #fff;
      font-family: Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow: hidden;
    }
    h1 {
      margin: 5px 0;
      font-size: 18px;
      color: #4caf50;
      text-align: center;
    }
    #game-container {
      position: relative;
      border: 3px solid #fff;
      box-shadow: 0 0 15px rgba(76, 175, 80, 0.4);
      background-color: #70c5ce;
      width: 100vw;
      max-width: 800px;
    }
    canvas {
      display: block;
      width: 100%;
      height: auto;
    }
    #ui {
      position: absolute;
      top: 6px;
      left: 6px;
      right: 6px;
      display: flex;
      justify-content: space-between;
      font-weight: bold;
      font-size: 13px;
      color: #000;
      background: rgba(255, 255, 255, 0.9);
      padding: 5px 10px;
      border-radius: 6px;
      pointer-events: none;
      z-index: 5;
    }
    /* Controles Táctiles Gigantes para Celular */
    #touch-controls {
      display: flex;
      justify-content: space-between;
      align-items: center;
      width: 100vw;
      max-width: 800px;
      padding: 10px 20px;
      margin-top: 5px;
    }
    .d-pad {
      display: flex;
      gap: 15px;
    }
    .btn-touch {
      background: #222;
      color: #fff;
      border: 3px solid #4caf50;
      font-size: 26px;
      font-weight: bold;
      width: 65px;
      height: 65px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 8px rgba(0,0,0,0.5);
    }
    .btn-touch:active {
      background: #4caf50;
      color: #000;
      transform: scale(0.95);
    }
    .btn-jump {
      width: 90px;
      height: 65px;
      border-radius: 35px;
      background: #1976D2;
      border-color: #fff;
      font-size: 14px;
    }
    /* Modal de Preguntas */
    #quiz-modal {
      display: none;
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.92);
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 15px;
      z-index: 10;
    }
