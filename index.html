<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Super Medix: Salud Pública Bros</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 0;
      background-color: #121212;
      color: #fff;
      font-family: Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }
    h1 {
      margin: 15px 0 10px;
      font-size: 26px;
      color: #4caf50;
      text-align: center;
    }
    #game-container {
      position: relative;
      border: 4px solid #fff;
      box-shadow: 0 0 20px rgba(76, 175, 80, 0.4);
      background-color: #70c5ce;
    }
    canvas {
      display: block;
    }
    #ui {
      position: absolute;
      top: 15px;
      left: 15px;
      right: 15px;
      display: flex;
      justify-content: space-between;
      font-weight: bold;
      font-size: 18px;
      color: #000;
      background: rgba(255, 255, 255, 0.85);
      padding: 8px 15px;
      border-radius: 8px;
      pointer-events: none;
    }
    #instructions {
      margin-top: 15px;
      font-size: 16px;
      text-align: center;
      color: #e0e0e0;
      background: #222;
      padding: 10px 20px;
      border-radius: 8px;
    }
    #quiz-modal {
      display: none;
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.9);
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
      z-index: 10;
    }
    #quiz-card {
      background: #222;
      border: 3px solid #4caf50;
      border-radius: 12px;
      padding: 25px;
      max-width: 650px;
      width: 90%;
      text-align: center;
      box-shadow: 0 0 25px rgba(0, 255, 0, 0.3);
    }
    #quiz-question {
      font-size: 20px;
      margin-bottom: 20px;
      color: #fff;
      line-height: 1.4;
    }
    .quiz-btn {
      display: block;
      width: 100%;
      background: #333;
      color: #fff;
      border: 2px solid #555;
      padding: 12px;
      margin: 10px 0;
      font-size: 16px;
      border-radius: 6px;
      cursor: pointer;
      transition: all 0.2s;
    }
    .quiz-btn:hover {
      background: #4caf50;
      border-color: #4caf50;
      color: #000;
      font-weight: bold;
    }
    #feedback {
      font-size: 18px;
      font-weight: bold;
      margin-top: 15px;
    }
  </style>
</head>
<body>

  <h1>🎮 SUPER MEDIX: SALUD PÚBLICA BROS 🩺</h1>
  <div id="game-container">
    <div id="ui">
      <div id="score">Monedas FESP: 0 / 4</div>
      <div id="lives">Vidas: ❤️❤️❤️❤️</div>
    </div>
    
    <div id="quiz-modal">
      <div id="quiz-card">
        <div id="quiz-question">Pregunta...</div>
        <div id="quiz-options"></div>
        <div id="feedback"></div>
      </div>
    </div>

    <canvas id="gameCanvas" width="800" height="400"></canvas>
  </div>

  <div id="instructions">
    <b>Moverse:</b> ⬅️ ➡️ Flechas / A-D | <b>Saltar:</b> ⬆️ / Espacio <br>
    ¡Toca las Monedas FESP y a los Enemigos para resolver las preguntas académicas!
  </div>

<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');

let score = 0;
let lives = 4;
let gameOver = false;
let gameWon = false;
let isPaused = false;
let message = "";

const keys = { right: false, left: false, up: false };

document.addEventListener('keydown', (e) => {
  if (isPaused) return;
  if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') keys.right = true;
  if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') keys.left = true;
  if ((e.key === 'ArrowUp' || e.key === ' ' || e.key === 'w' || e.key === 'W') && !player.jumping) {
    player.vy = -player.jumpStrength;
    player.jumping = true;
  }
});

document.addEventListener('keyup', (e) => {
  if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') keys.right = false;
  if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') keys.left = false;
});

const player = {
  x: 50,
  y: 300,
  width: 36,
  height: 48,
  speed: 5,
  vy: 0,
  gravity: 0.8,
