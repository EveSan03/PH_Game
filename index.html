<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Super Medix: Salud Pública Bros</title>
  <style>
    * { box-sizing: border-box; touch-action: manipulation; }
    body {
      margin: 0;
      padding: 0;
      background-color: #121212;
      color: #fff;
      font-family: Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow: hidden;
    }
    h1 {
      margin: 8px 0 4px;
      font-size: 20px;
      color: #4caf50;
      text-align: center;
    }
    #game-container {
      position: relative;
      border: 3px solid #fff;
      box-shadow: 0 0 15px rgba(76, 175, 80, 0.4);
      background-color: #70c5ce;
      max-width: 100vw;
    }
    canvas {
      display: block;
      width: 100%;
      max-width: 800px;
      height: auto;
    }
    #ui {
      position: absolute;
      top: 8px;
      left: 8px;
      right: 8px;
      display: flex;
      justify-content: space-between;
      font-weight: bold;
      font-size: 14px;
      color: #000;
      background: rgba(255, 255, 255, 0.9);
      padding: 6px 12px;
      border-radius: 6px;
      pointer-events: none;
      z-index: 5;
    }
    /* Controles Táctiles para Móvil */
    #touch-controls {
      display: flex;
      justify-content: space-between;
      width: 100%;
      max-width: 800px;
      padding: 10px 15px;
      margin-top: 5px;
    }
    .d-pad {
      display: flex;
      gap: 10px;
    }
    .btn-touch {
      background: #333;
      color: #fff;
      border: 2px solid #4caf50;
      font-size: 22px;
      font-weight: bold;
      width: 60px;
      height: 60px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      user-select: none;
      -webkit-user-select: none;
    }
    .btn-touch:active {
      background: #4caf50;
      color: #000;
    }
    .btn-jump {
      width: 75px;
      height: 60px;
      border-radius: 30px;
      background: #2196F3;
      border-color: #fff;
    }
    /* Modal de Preguntas */
    #quiz-modal {
      display: none;
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.92);
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 15px;
      z-index: 10;
    }
    #quiz-card {
      background: #222;
      border: 3px solid #4caf50;
      border-radius: 12px;
      padding: 18px;
      max-width: 600px;
      width: 95%;
      text-align: center;
    }
