<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Super Medix: Salud Pública Bros</title>
  <style>
    * { 
      box-sizing: border-box; 
      touch-action: manipulation;
      user-select: none;
      -webkit-user-select: none;
    }
    body {
      margin: 0;
      padding: 0;
      background-color: #121212;
      color: #fff;
      font-family: Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow: hidden;
    }
    h1 {
      margin: 6px 0;
      font-size: 18px;
      color: #4caf50;
      text-align: center;
    }
    #game-container {
      position: relative;
      border: 3px solid #fff;
      box-shadow: 0 0 15px rgba(76, 175, 80, 0.4);
      background-color: #70c5ce;
      width: 95vw;
      max-width: 800px;
    }
    canvas {
      display: block;
      width: 100%;
      height: auto;
      background-color: #70c5ce;
    }
    #ui {
      position: absolute;
      top: 6px;
      left: 6px;
      right: 6px;
      display: flex;
      justify-content: space-between;
      font-weight: bold;
      font-size: 13px;
      color: #000;
      background: rgba(255, 255, 255, 0.92);
      padding: 6px 12px;
      border-radius: 6px;
      pointer-events: none;
      z-index: 5;
    }
    #touch-controls {
      display: flex;
      justify-content: space-between;
      align-items: center;
      width: 95vw;
      max-width: 800px;
      padding: 8px 10px;
      margin-top: 6px;
    }
    .d-pad {
      display: flex;
      gap: 12px;
    }
    .btn-touch {
      background: #222;
      color: #fff;
      border: 3px solid #4caf50;
      font-size: 24px;
      font-weight: bold;
      width: 58px;
      height: 58px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 8px rgba(0,0,0,0.5);
      cursor: pointer;
    }
    .btn-touch:active {
      background: #4caf50;
      color: #000;
      transform: scale(0.95);
    }
    .btn-jump {
      width: 95px;
      height: 58px;
      border-radius: 30px;
      background: #1976D2;
      border-color: #fff;
      font-size: 13px;
    }
    #quiz-modal {
      display: none;
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.93);
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 15px;
      z-index: 10;
    }
    #quiz-card {
      background: #222;
      border: 3px solid #4caf50;
      border-radius: 12px;
      padding: 18px;
      max-width: 650px;
      width: 95%;
      text-align: center;
    }
    #quiz-question {
      font-size: 15px;
      margin-bottom: 12px;
      color: #fff;
      line-height: 1.35;
      font-weight: bold;
    }
    .quiz-btn {
      display: block;
      width: 100%;
      background: #333;
      color: #fff;
      border: 2px solid #555;
      padding: 9px;
      margin: 6px 0;
      font-size: 13.5px;
      border-radius: 6px;
      cursor: pointer;
      text-align: left;
    }
    .quiz-btn:active, .quiz-btn:hover {
      background: #4caf50;
      color: #000;
      font-weight: bold;
    }
    #feedback {
      font-size: 15px;
      font-weight: bold;
      margin-top: 8px;
    }
  </style>
</head>
<body>

  <h1>🎮 SUPER MEDIX: SALUD PÚBLICA BROS 🩺</h1>
  <div id="game-container">
    <div id="ui">
      <div id="score">Aciertos: 0 (Mínimo 7 para Aprobar)</div>
      <div id="lives">Vidas: ❤️❤️❤️❤️</div>
    </div>
    
    <div id="quiz-modal">
      <div id="quiz-card">
        <div id="quiz-question">Pregunta...</div>
        <div id="quiz-options"></div>
        <div id="feedback"></div>
      </div>
    </div>

    <canvas id="gameCanvas" width="800" height="400"></canvas>
  </div>

  <div id="touch-controls">
    <div class="d-pad">
      <div class="btn-touch" id="btn-left">⬅️</div>
      <div class="btn-touch" id="btn-right">➡️</div>
    </div>
    <div class="btn-touch btn-jump" id="btn-jump">🪂 SALTAR</div>
  </div>

<script>
window.onload = function() {
  const canvas = document.getElementById('gameCanvas');
  if (!canvas) return;
  const ctx = canvas.getContext('2d');

  let aciertos = 0;
  let lives = 4;
  let gameOver = false;
  let gameWon = false;
  let isPaused = false;
  let message = "";
  let invulnerableTimer = 0;

  const keys = { right: false, left: false, up: false };

  document.addEventListener('keydown', function(e) {
    if (isPaused) return;
    if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') keys.right = true;
    if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') keys.left = true;
    if ((e.key === 'ArrowUp' || e.key === ' ' || e.key === 'w' || e.key === 'W') && !player.jumping) {
      player.vy = -player.jumpStrength;
      player.jumping = true;
    }
  });

  document.addEventListener('keyup', function(e) {
    if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') keys.right = false;
    if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') keys.left = false;
  });

  function setupTouch(id, action) {
    const btn = document.getElementById(id);
    if (!btn) return;

    function press(e) {
      if (e.cancelable) e.preventDefault();
      if (isPaused) return;
      if (action === 'jump') {
        if (!player.jumping) {
          player.vy = -player.jumpStrength;
          player.jumping = true;
        }
      } else {
        keys[action] = true;
      }
    }

    function release(e) {
      if (e.cancelable) e.preventDefault();
      if (action !== 'jump') keys[action] = false;
    }

    btn.addEventListener('touchstart', press, { passive: false });
    btn.addEventListener('touchend', release, { passive: false });
    btn.addEventListener('mousedown', press);
    btn.addEventListener('mouseup', release);
  }

  setupTouch('btn-left', 'left');
  setupTouch('btn-right', 'right');
  setupTouch('btn-jump', 'jump');

  const player = {
    x: 50, y: 300, width: 36, height: 48,
    speed: 5.5, vy: 0, gravity: 0.8, jumpStrength: 15.5, jumping: false
  };

    { x: 500, y: 230, width: 160, height: 20, label: "Concepto OMS" },
    { x: 850, y: 260, width: 160, height: 20, label: "FESP: Evaluación" },
    { x: 1200, y: 220, width: 160, height: 20, label: "FESP: Promoción" },
    { x: 1550, y: 260, width: 160, height: 20, label: "FESP: Acceso" },
    { x: 1900, y: 220, width: 160, height: 20, label: "Epidemiología" },
    { x: 2250, y: 260, width: 160, height: 20, label: "Incidencia/Prevalencia" },
    { x: 2600, y: 210, width: 160, height: 20, label: "Transición" },
    { x: 2950, y: 250, width: 160, height: 20, label: "Perfil Nal." },
    { x: 3300, y: 210, width: 160, height: 20, label: "Hanlon" },
    { x: 3650, y: 250, width: 160, height: 20, label: "Fuentes Oficiales" }
  ];

  // 12 PREGUNTAS TOTALES REINTENTABLES
  const questions = [
    {

      text: "1. De acuerdo con Julio Frenk, ¿cuál es la esencia del concepto moderno de Salud Pública?",
      options: [
        "A) La atención médica individualizada en el consultorio privado.",
        "B) La aplicación de conocimientos biológicos y sociales para la salud de las poblaciones.",
        "C) La administración exclusiva de infraestructura hospitalaria."
      ],
      correct: 1
    },
    {
      id: 2, type: 'enemy', x: 550, y: 190, width: 35, height: 35, vx: -1.2, minX: 500, maxX: 640, solved: false,
      text: "2. ¿Cómo define la Organización Mundial de la Salud (OMS) el concepto de SALUD?",
      options: [
        "A) La ausencia total de enfermedades, gérmenes e invalidez.",
        "B) Un estado de completo bienestar físico, mental y social, y no solo la ausencia de afecciones.",
        "C) El correcto funcionamiento biológico de los órganos vitales."
      ],
      correct: 1
    },
    {
      id: 3, type: 'coin', x: 900, y: 210, solved: false,
      text: "3. ¿A qué pilar de las FESP pertenece la vigilancia epidemiológica y evaluación del estado de salud poblacional?",
      options: [
        "A) Evaluación
