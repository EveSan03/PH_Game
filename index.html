<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Super Medix: Salud Pública Bros</title>
  <style>
    * { 
      box-sizing: border-box; 
      touch-action: manipulation;
      user-select: none;
      -webkit-user-select: none;
    }
    body {
      margin: 0;
      padding: 0;
      background-color: #121212;
      color: #fff;
      font-family: Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow: hidden;
    }
    h1 {
      margin: 6px 0;
      font-size: 18px;
      color: #4caf50;
      text-align: center;
    }
    #game-container {
      position: relative;
      border: 3px solid #fff;
      box-shadow: 0 0 15px rgba(76, 175, 80, 0.4);
      background-color: #70c5ce;
      width: 95vw;
      max-width: 800px;
    }
    canvas {
      display: block;
      width: 100%;
      height: auto;
    }
    #ui {
      position: absolute;
      top: 6px;
      left: 6px;
      right: 6px;
      display: flex;
      justify-content: space-between;
      font-weight: bold;
      font-size: 13px;
      color: #000;
      background: rgba(255, 255, 255, 0.92);
      padding: 6px 12px;
      border-radius: 6px;
      pointer-events: none;
      z-index: 5;
    }
    /* Controles Táctiles para Móviles */
    #touch-controls {
      display: flex;
      justify-content: space-between;
      align-items: center;
      width: 95vw;
      max-width: 800px;
      padding: 8px 10px;
      margin-top: 6px;
    }
    .d-pad {
      display: flex;
      gap: 12px;
    }
    .btn-touch {
      background: #222;
      color: #fff;
      border: 3px solid #4caf50;
      font-size: 24px;
      font-weight: bold;
      width: 58px;
      height: 58px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 8px rgba(0,0,0,0.5);
      cursor: pointer;
    }
    .btn-touch:active {
      background: #4caf50;
      color: #000;
      transform: scale(0.95);
    }
    .btn-jump {
      width: 95px;
      height: 58px;
      border-radius: 30px;
      background: #1976D2;
      border-color: #fff;
      font-size: 13px;
    }
    /* Modal de Preguntas */
    #quiz-modal {
      display: none;
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.93);
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 15px;
      z-index: 10;
    }
    #quiz-card {
      background: #222;
      border: 3px solid #4caf50;
      border-radius: 12px;
      padding: 18px;
      max-width: 650px;
      width: 95%;
      text-align: center;
    }
    #quiz-question {
      font-size: 15px;
      margin-bottom: 12px;
      color: #fff;
      line-height: 1.35;
      font-weight: bold;
    }
    .quiz-btn {
      display: block;
      width: 100%;
      background: #333;
      color: #fff;
      border: 2px solid #555;
      padding: 9px;
      margin: 6px 0;
      font-size: 13.5px;
      border-radius: 6px;
      cursor: pointer;
      text-align: left;
    }
    .quiz-btn:active, .quiz-btn:hover {
      background: #4caf50;
      color: #000;
      font-weight: bold;
    }
    #feedback {
      font-size: 15px;
      font-weight: bold;
      margin-top: 8px;
    }
  </style>
</head>
<body>

  <h1>🎮 SUPER MEDIX: SALUD PÚBLICA BROS 🩺</h1>
  <div id="game-container">
    <div id="ui">
      <div id="score">Aciertos: 0 / 10 (Mínimo 7)</div>
      <div id="lives">Vidas: ❤️❤️❤️❤️</div>
    </div>
    
    <div id="quiz-modal">
      <div id="quiz-card">
        <div id="quiz-question">Pregunta...</div>
        <div id="quiz-options"></div>
        <div id="feedback"></div>
      </div>
    </div>

    <canvas id="gameCanvas" width="800" height="400"></canvas>
  </div>

  <div id="touch-controls">
    <div class="d-pad">
      <div class="btn-touch" id="btn-left">⬅️</div>
      <div class="btn-touch" id="btn-right">➡️</div>
    </div>
    <div class="btn-touch btn-jump" id="btn-jump">🪂 SALTAR</div>
  </div>

<script>
window.addEventListener('load', function() {
  const canvas = document.getElementById('gameCanvas');
  if (!canvas) return;
  const ctx = canvas.getContext('2d');

  let aciertos = 0;
  let lives = 4;
  let gameOver = false;
  let gameWon = false;
  let isPaused = false;
  let message = "";
  let invulnerableTimer = 0;

  const keys = { right: false, left: false, up: false };

  document.addEventListener('keydown', function(e) {
    if (isPaused) return;
    if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') keys.right = true;
    if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') keys.left = true;
    if ((e.key === 'ArrowUp' || e.key === ' ' || e.key === 'w' || e.key === 'W') && !player.jumping) {
      player.vy = -player.jumpStrength;
      player.jumping = true;
    }
  });

  document.addEventListener('keyup', function(e) {
    if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') keys.right = false;
    if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') keys.left = false;
  });

  function setupTouch(id, action) {
    const btn = document.getElementById(id);
    if (!btn) return;

    function press(e) {
      if (e.cancelable) e.preventDefault();
      if (isPaused) return;
      if (action === 'jump') {
        if (!player.jumping) {
          player.vy = -player.jumpStrength;
          player.jumping = true;
        }
      } else {
        keys[action] = true;
      }
    }

    function release(e) {
      if (e.cancelable) e.preventDefault();
      if (action !== 'jump') keys[action] = false;
    }

    btn.addEventListener('touchstart', press, { passive: false });
    btn.addEventListener('touchend', release, { passive: false });
    btn.addEventListener('mousedown', press);
    btn.addEventListener('mouseup', release);
  }

  setupTouch('btn-left', 'left');
  setupTouch('btn-right', 'right');
  setupTouch('btn-jump', 'jump');

  const player = {
    x: 50, y: 300, width: 36, height: 48,
    speed: 5.5, vy: 0, gravity: 0.8, jumpStrength: 15.5, jumping: false
  };

  const platforms = [
    { x: 0, y: 360, width: 3200, height: 40 },
    { x: 200, y: 270, width: 140, height: 20, label: "Salud Pública" },
    { x: 450, y: 220, width: 150, height: 20, label: "FESP" },
    { x: 750, y: 250, width: 160, height: 20, label: "Modelos Teóricos" },
    { x: 1050, y: 210, width: 150, height: 20, label: "Bioestadística" },
    { x: 1380, y: 260, width: 160, height: 20, label: "Epidemiología" },
    { x: 1700, y: 210, width: 150, height: 20, label: "Ocurrencia" },
    { x: 2020, y: 250, width: 160, height: 20, label: "Transición" },
    { x: 2350, y: 200, width: 150, height: 20, label: "Perfil Nal." },
    { x: 2680, y: 240, width: 160, height: 20, label: "Hanlon & Fuentes" }
  ];

  // 10 PREGUNTAS ULTRA-IMPORTANTES BASADAS EN EL PROGRAMA ACADÉMICO FACMED
  const questions = [
    {
      id: 1, type: 'coin', x: 250, y: 220, collected: false,
      text: "1. ¿Cuál es el objeto de estudio fundamental de la Salud Pública?",
      options: [
        "A) La atención clínica y curación individual en consultorio.",
        "B) La salud y el proceso salud-enfermedad en las poblaciones humanas.",
        "C) La administración exclusiva de insumos hospitalarios."
      ],
      correct: 1
    },
    {
      id: 2, type: 'enemy', x: 480, y: 325, width: 35, height: 35, vx: -1.5, defeated: false,
      text: "2. ¿Cuál es el propósito central de las Funciones Esenciales de la Salud Pública (FESP)?",
      options: [
        "A) Orientar la respuesta institucional ante problemas prioritarios de salud pública.",
        "B) Diagnosticar sintomatologías raras en pacientes individuales.",
        "C) Sustituir el expediente clínico por datos de laboratorio privados."
      ],
      correct: 0
    },
    {
      id: 3, type: 'coin', x: 800, y: 200, collected: false,
      text: "3. ¿Qué caracteriza al 'Modelo Biomédico' del proceso salud-enfermedad?",
      options: [
        "A) Considera dimensiones sociales, económicas y culturales.",
        "B) Se centra predominantemente en la causa biológica/patógena e ignora lo social.",
        "C) Prioriza la promoción de la salud por encima del tratamiento patológico."
      ],
      correct: 1
    },
    {
      id: 4, type: 'enemy', x: 1100, y: 325, width: 35, height: 35, vx: 2, defeated: false,
      text: "4. En Bioestadística, ¿cuál es la diferencia clave entre INCIDENCIA y PREVALENCIA?",
      options: [
        "A) La Incidencia mide casos NUEVOS; la Prevalencia mide la TOTALIDAD de casos existentes.",
        "B) La Incidencia mide fallecimientos; la Prevalencia mide contagios leves.",
        "C) Ambas corresponden exactamente a la misma tasa de mortalidad general."
      ],
      correct: 0
    },
    {
      id: 5, type: 'coin', x: 1420, y: 210, collected: false,
      text: "5. ¿Cuáles son las variables clásicas de la descripción epidemiológica de un evento?",
      options: [
        "A) Tensión, Frecuencia y Temperatura.",
        "B) Tiempo, Lugar y Persona.",
        "C) Media, Mediana y Desviación Estándar."
      ],
      correct: 1
    },
    {
      id: 6, type: 'enemy', x: 1750, y: 325, width: 35, height: 35, vx: -2, defeated: false,
      text: "6. ¿Cómo se define el indicador de LETALIDAD en epidemiología?",
      options: [
        "A) La proporción de enfermos por una causa que fallecen a consecuencia de la misma.",
        "B) El número de nacimientos registrados por cada 100,000 habitantes.",
        "C) La cantidad total de personas sanas en riesgo de contagio."
      ],
      correct: 0
    },
    {
      id: 7, type: 'coin', x: 2060, y: 200, collected: false,
      text: "7. ¿En qué consiste la Transición Epidemiológica vivida en México?",
      options: [
        "A) El cambio del predominio de infecciones hacia enfermedades crónico-degenerativas.",
        "B) El paso exclusivo de una población rural a una eminentemente universitaria.",
        "C) La sustitución total de vacunas por tratamientos hospitalarios."
      ],
      correct: 0
    },
    {
      id: 8, type: 'enemy', x: 2380, y: 325, width: 35, height: 35, vx: 1.8, defeated: false,
      text: "8. ¿Cuál es la tendencia actual de la Transición Demográfica en México?",
      options: [
        "A) Aumento de la tasa de fecundidad infantil exponencial.",
        "B) Disminución de la natalidad e incremento de la población de adultos mayores.",
        "C) Reducción general de la esperanza de vida al nacer."
      ],
      correct: 1
    },
    {
      id: 9, type: 'coin', x: 2720, y: 190, collected: false,
      text: "9. ¿Para qué se utiliza el Método de Hanlon en Salud Pública?",
      options: [
        "A) Para calcular la mediana y desviación típica en un estudio clínico.",
        "B) Para la priorización de problemas de salud pública basada en magnitud y severidad.",
        "C) Para determinar el tipo de antibiótico de primera elección."
      ],
      correct: 1
    },
    {
      id: 10, type: 'coin', x: 2950, y: 220, collected: false,
      text: "10. ¿Cuáles son fuentes oficiales clave de información epidemiológica en México?",
      options: [
        "A) Solamente registros de farmacias comerciales comunitarias.",
        "B) DGE, DGIS, INEGI, CONAPO y ENSANUT.",
        "C) Revistas internacionales no validadas ni institucionales."
      ],
      correct: 1
    }
  ];

  const goal = { x: 3100, y: 260, width: 70, height: 100 };
  let cameraX = 0;

  function triggerQuiz(q) {
    isPaused = true;
    keys.right = false; 
    keys.left = false;
    
    const modal = document.getElementById('quiz-modal');
    const qText = document.getElementById('quiz-question');
    const qOptions = document.getElementById('quiz-options');
    const feedback = document.getElementById('feedback');
    
    modal.style.display = 'flex';
    qText.innerText = q.text;
    qOptions.innerHTML = '';
    feedback.innerText = '';

    q.options.forEach(function(opt, idx) {
      const btn = document.createElement('button');
      btn.className = 'quiz-btn';
      btn.innerText = opt;
      btn.onclick = function() {
        if (idx === q.correct) {
          feedback.style.color = '#4caf50';
          feedback.innerText = "¡CORRECTO! +1 Acierto";
          aciertos++;
          updateScoreUI();
          
          if (q.type === 'coin') {
            q.collected = true;
          } else {
            q.defeated = true;
            q.x = -999;
          }

          setTimeout(function() {
            modal.style.display = 'none';
            isPaused = false;
          }, 1200);
        } else {
          feedback.style.color = '#ff5252';
          feedback.innerText = "❌ INCORRECTO. Pierdes 1 vida.";
          lives--;
          updateLives();
          
          if (q.type === 'coin') {
            q.collected = true;
          } else {
            q.x -= 120;
          }

          setTimeout(function() {
            modal.style.display = 'none';
            isPaused = false;
            if (lives <= 0) gameOver = true;
          }, 1500);
        }
      };
      qOptions.appendChild(btn);
    });
  }

  function takeDamage() {
    if (invulnerableTimer > 0) return;
    lives--;
    updateLives();
    invulnerableTimer = 60;
    player.vy = -8;
    player.x -= 40;
    message = "💥 ¡Te contagiaste! -1 Vida";
    if (lives <= 0) gameOver = true;
  }

  function updateScoreUI() {
    document.getElementById('score').innerText = "Aciertos: " + aciertos + " / 10 (Mínimo 7)";
  }

  function updateLives() {
    let h = "";
    for(let i = 0; i < lives; i++) h += "❤️";
    document.getElementById('lives').innerText = "Vidas: " + h;
  }

  function update() {
    if (gameOver || gameWon || isPaused) return;

    if (invulnerableTimer > 0) invulnerableTimer--;

    if (keys.right) player.x += player.speed;
    if (keys.left && player.x > 0) player.x -= player.speed;

    player.vy += player.gravity;
    player.y += player.vy;

    player.jumping = true;
    platforms.forEach(function(p) {
      if (
        player.x < p.x + p.width &&
        player.x + player.width > p.x &&
        player.y + player.height > p.y &&
        player.y + player.height - player.vy <= p.y
      ) {
        player.y = p.y - player.height;
        player.vy = 0;
        player.jumping = false;
      }
    });

    questions.forEach(function(q) {
      if (q.type === 'coin' && !q.collected) {
        if (
          player.x < q.x + 24 &&
          player.x + player.width > q.x &&
          player.y < q.y + 24 &&
          player.y + player.height > q.y
        ) {
          triggerQuiz(q);
        }
      } else if (q.type === 'enemy' && !q.defeated) {
        q.x += q.vx;
        if (q.x < 350 || q.x >
