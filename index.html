<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Super Medix: Salud Pública Bros</title>
  <style>
    * { 
      box-sizing: border-box; 
      touch-action: manipulation;
      user-select: none;
      -webkit-user-select: none;
    }
    body {
      margin: 0;
      padding: 0;
      background-color: #121212;
      color: #fff;
      font-family: Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow: hidden;
    }
    h1 {
      margin: 6px 0;
      font-size: 18px;
      color: #4caf50;
      text-align: center;
    }
    #game-container {
      position: relative;
      border: 3px solid #fff;
      box-shadow: 0 0 15px rgba(76, 175, 80, 0.4);
      background-color: #70c5ce;
      width: 95vw;
      max-width: 800px;
    }
    canvas {
      display: block;
      width: 100%;
      height: auto;
      background-color: #70c5ce;
    }
    #ui {
      position: absolute;
      top: 6px;
      left: 6px;
      right: 6px;
      display: flex;
      justify-content: space-between;
      font-weight: bold;
      font-size: 13px;
      color: #000;
      background: rgba(255, 255, 255, 0.92);
      padding: 6px 12px;
      border-radius: 6px;
      pointer-events: none;
      z-index: 5;
    }
    #touch-controls {
      display: flex;
      justify-content: space-between;
      align-items: center;
      width: 95vw;
      max-width: 800px;
      padding: 8px 10px;
      margin-top: 6px;
    }
    .d-pad {
      display: flex;
      gap: 12px;
    }
    .btn-touch {
      background: #222;
      color: #fff;
      border: 3px solid #4caf50;
      font-size: 24px;
      font-weight: bold;
      width: 58px;
      height: 58px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 8px rgba(0,0,0,0.5);
      cursor: pointer;
    }
    .btn-touch:active {
      background: #4caf50;
      color: #000;
      transform: scale(0.95);
    }
    .btn-jump {
      width: 95px;
      height: 58px;
      border-radius: 30px;
      background: #1976D2;
      border-color: #fff;
      font-size: 13px;
    }
    #quiz-modal {
      display: none;
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.93);
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 15px;
      z-index: 10;
    }
    #quiz-card {
      background: #222;
      border: 3px solid #4caf50;
      border-radius: 12px;
      padding: 18px;
      max-width: 650px;
      width: 95%;
      text-align: center;
    }
    #quiz-question {
      font-size: 15px;
      margin-bottom: 12px;
      color: #fff;
      line-height: 1.35;
      font-weight: bold;
    }
    .quiz-btn {
      display: block;
      width: 100%;
      background: #333;
      color: #fff;
      border: 2px solid #555;
      padding: 9px;
      margin: 6px 0;
      font-size: 13.5px;
      border-radius: 6px;
      cursor: pointer;
      text-align: left;
    }
    .quiz-btn:active, .quiz-btn:hover {
      background: #4caf50;
      color: #000;
      font-weight: bold;
    }
    #feedback {
      font-size: 15px;
      font-weight: bold;
      margin-top: 8px;
    }
  </style>
</head>
<body>

  <h1>🎮 SUPER MEDIX: SALUD PÚBLICA BROS 🩺</h1>
  <div id="game-container">
    <div id="ui">
      <div id="score">Aciertos: 0 / 10 (Mínimo 7)</div>
      <div id="lives">Vidas: ❤️❤️❤️❤️</div>
    </div>
    
    <div id="quiz-modal">
      <div id="quiz-card">
        <div id="quiz-question">Pregunta...</div>
        <div id="quiz-options"></div>
        <div id="feedback"></div>
      </div>
    </div>

    <canvas id="gameCanvas" width="800" height="400"></canvas>
  </div>

  <div id="touch-controls">
    <div class="d-pad">
      <div class="btn-touch" id="btn-left">⬅️</div>
      <div class="btn-touch" id="btn-right">➡️</div>
    </div>
    <div class="btn-touch btn-jump" id="btn-jump">🪂 SALTAR</div>
  </div>

<script>
window.onload = function() {
  const canvas = document.getElementById('gameCanvas');
  if (!canvas) return;
  const ctx = canvas.getContext('2d');

  let aciertos = 0;
  let lives = 4;
  let gameOver = false;
  let gameWon = false;
  let isPaused = false;
  let message = "";
  let invulnerableTimer = 0;

  const keys = { right: false, left: false, up: false };

  document.addEventListener('keydown', function(e) {
    if (isPaused) return;
    if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') keys.right = true;
    if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') keys.left = true;
    if ((e.key === 'ArrowUp' || e.key === ' ' || e.key === 'w' || e.key === 'W') && !player.jumping) {
      player.vy = -player.jumpStrength;
      player.jumping = true;
    }
  });

  document.addEventListener('keyup', function(e) {
    if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') keys.right = false;
    if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') keys.left = false;
  });

  function setupTouch(id, action) {
    const btn = document.getElementById(id);
    if (!btn) return;

    function press(e) {
      if (e.cancelable) e.preventDefault();
      if (isPaused) return;
      if (action === 'jump') {
        if (!player.jumping) {
          player.vy = -player.jumpStrength;
          player.jumping = true;
        }
      } else {
        keys[action] = true;
      }
    }

    function release(e) {
      if (e.cancelable) e.preventDefault();
      if (action !== 'jump') keys[action] = false;
    }

    btn.addEventListener('touchstart', press, { passive: false });
    btn.addEventListener('touchend', release, { passive: false });
    btn.addEventListener('mousedown', press);
    btn.addEventListener('mouseup', release);
  }

  setupTouch('btn-left', 'left');
  setupTouch('btn-right', 'right');
  setupTouch('btn-jump', 'jump');

  const player = {
    x: 50, y: 300, width: 36, height: 48,
    speed: 5.5, vy: 0, gravity: 0.8, jumpStrength: 15.5, jumping: false
  };

  const platforms = [
    { x: 0, y: 360, width: 3800, height: 40 },
    { x: 200, y: 270, width: 140, height: 20, label: "Salud Pública" },
    { x: 500, y: 230, width: 160, height: 20, label: "Concepto OMS" },
    { x: 850, y: 260, width: 160, height: 20, label: "FESP: Monitoreo" },
    { x: 1200, y: 220, width: 160, height: 20, label: "FESP: Políticas" },
    { x: 1550, y: 260, width: 160, height: 20, label: "FESP: Acceso" },
    { x: 1900, y: 220, width: 160, height: 20, label: "Epidemiología" },
    { x: 2250, y: 260, width: 160, height: 20, label: "Incidencia/Prevalencia" },
    { x: 2600, y: 210, width: 160, height: 20, label: "Transición" },
    { x: 2950, y: 250, width: 160, height: 20, label: "Hanlon & Fuentes" }
  ];

  // BANCO DE 10 PREGUNTAS ENFOCADAS EN CONCEPTO OMS, SALUD PÚBLICA Y FESP
  const questions = [
    {
      id: 1, type: 'coin', x: 250, y: 220, collected: false,
      text: "1. De acuerdo con Julio Frenk, ¿cuál es la esencia del concepto moderno de Salud Pública?",
      options: [
        "A) La atención médica individualizada en el consultorio privado.",
        "B) La aplicación de conocimientos biológicos y sociales para la salud de las poblaciones.",
        "C) La administración exclusiva de infraestructura hospitalaria."
      ],
      correct: 1
    },
    {
      id: 2, type: 'enemy', x: 550, y: 190, width: 35, height: 35, vx: -1.2, minX: 500, maxX: 640, defeated: false,
      text: "2. ¿Cómo define la Organización Mundial de la Salud (OMS) el concepto de SALUD?",
      options: [
        "A) La ausencia total de enfermedades, gérmenes e invalidez.",
        "B) Un estado de completo bienestar físico, mental y social, y no solo la ausencia de afecciones.",
        "C) El correcto funcionamiento biológico de los órganos vitales."
      ],
      correct: 1
    },
    {
      id: 3, type: 'coin', x: 900, y: 210, collected: false,
      text: "3. ¿A qué pilar de las FESP pertenece la vigilancia epidemiológica y evaluación del estado de salud poblacional?",
      options: [
        "A) Evaluación y análisis de la situación de salud.",
        "B) Asignación directa de insumos médicos.",
        "C) Investigación clínica privada."
      ],
      correct: 0
    },
    {
      id: 4, type: 'enemy', x: 1250, y: 180, width: 35, height: 35, vx: 1.5, minX: 1200, maxX: 1340, defeated: false,
      text: "4. En el marco renovado de las FESP, ¿cuál es la meta de la 'Promoción de la Salud y Participación Ciudadana'?",
      options: [
        "A) Empoderar a la comunidad y modificar determinantes sociales de la salud.",
        "B) Sancionar económicamente a los ciudadanos con estilos de vida sedentarios.",
        "C) Obligar el uso de medicamentos preventivos de amplio espectro."
      ],
      correct: 0
    },
    {
      id: 5, type: 'coin', x: 1600, y: 210, collected: false,
      text: "5. ¿Cuál es la función esencial (FESP) orientada a garantizar que toda la población reciba atención de calidad?",
      options: [
        "A) Garantía de acceso equitativo a servicios de salud integrales.",
        "B) Auditoría contable del sistema hospitalario privado.",
        "C) Regulación del mercado farmacéutico internacional."
      ],
      correct: 0
    },
    {
      id: 6, type: 'enemy', x: 1950, y: 180, width: 35, height: 35, vx: -1.5, minX: 1900, maxX: 2040, defeated: false,
      text: "6. ¿Cuáles son las variables fundamentales del Método Epidemiológico para describir un problema colectivo?",
      options: [
        "A) Tiempo, Lugar y Persona.",
        "B) Tensión, Frecuencia y Temperatura.",
        "C) Media, Mediana y Desviación Estándar."
      ],
      correct: 0
    },
    {
      id: 7, type: 'coin', x: 2300, y: 210, collected: false,
      text: "7. En Bioestadística, ¿qué diferencia a la INCIDENCIA de la PREVALENCIA?",
      options: [
        "A) Incidencia evalúa casos NUEVOS; Prevalencia mide TODOS los casos acumulados existentes.",
        "B) Incidencia mide muertes registradas; Prevalencia mide nacimientos anuales.",
        "C) Ambas indican exactamente la misma tasa de mortalidad."
      ],
      correct: 0
    },
    {
      id: 8, type: 'enemy', x: 2650, y: 170, width: 35, height: 35, vx: 1.2, minX: 2600, maxX: 2740, defeated: false,
      text: "8. ¿En qué consiste la Transición Epidemiológica observada en México?",
      options: [
        "A) Cambio del predominio de patologías infecciosas a enfermedades crónico-degenerativas.",
        "B) Incremento acelerado de nacimientos en zonas urbanas.",
        "C) Eliminación total de enfermedades transmisibles e infectocontagiosas."
      ],
      correct: 0
    },
    {
      id: 9, type: 'coin', x: 3000, y: 200, collected: false,
      text: "9. ¿Para qué aplica el médico general el Método de Hanlon en Salud Pública?",
      options: [
        "A) Para priorizar problemas de salud considerando magnitud, severidad e intervención.",
        "B) Para calcular la dosis ponderada de un fármaco.",
        "C) Para determinar el tipo de muestra microbiológica requerida."
      ],
      correct: 0
    },
    {
      id: 10, type: 'enemy', x: 3300, y: 325, width: 35, height: 35, vx: -1.8, minX: 3200, maxX: 3450, defeated: false,
      text: "10. ¿Cuáles son fuentes oficiales nacionales prioritarias para obtener indicadores de salud en México?",
      options: [
        "A) DGE, DGIS, INEGI, CONAPO y ENSANUT.",
        "B) Expedientes aislados de sanatorios privados.",
        "C) Encuestas informales de redes sociales."
      ],
      correct: 0
    }
  ];

  const goal = { x: 3550, y: 260, width: 70, height: 100 };
  let cameraX = 0;

  function triggerQuiz(q) {
    isPaused = true;
    keys.right = false; 
    keys.left = false;
    
    const modal = document.getElementById('quiz-modal');
    const qText = document.getElementById('quiz-question');
    const qOptions = document.getElementById('quiz-options');
    const feedback = document.getElementById('feedback');
    
    modal.style.display = 'flex';
    qText.innerText = q.text;
    qOptions.innerHTML = '';
    feedback.innerText = '';

    q.options.forEach(function(opt, idx) {
      const btn = document.createElement('button');
      btn.className = 'quiz-btn';
      btn.innerText = opt;
      btn.onclick = function() {
        if (idx === q.correct) {
          feedback.style.color = '#4caf50';
          feedback.innerText = "¡CORRECTO! +1 Acierto";
          aciertos++;
          updateScoreUI();
          
          if (q.type === 'coin') {
            q.collected = true;
          } else {
            q.defeated = true;
            q.x = -999;
          }

          setTimeout(function() {
            modal.style.display = 'none';
            isPaused = false;
          }, 1200);
        } else {
          feedback.style.color = '#ff5252';
          feedback.innerText = "❌ INCORRECTO. Pierdes 1 vida.";
          lives--;
          updateLives();
          
          if (q.type === 'coin') {
            q.collected = true;
          } else {
            q.defeated = true;
            q.x = -999;
          }

          setTimeout(function() {
            modal.style.display = 'none';
            isPaused = false;
            if (lives <= 0) gameOver = true;
          }, 1500);
        }
      };
      qOptions.appendChild(btn);
    });
  }

  function takeDamage() {
    if (invulnerableTimer > 0) return;
    lives--;
    updateLives();
    invulnerableTimer = 60;
    player.vy = -6;
    player.x -= 50;
    message = "💥 ¡Un virus te contagió! Pierdes 1 Vida.";
    if (lives <= 0) gameOver = true;
  }

  function updateScoreUI() {
    document.getElementById('score').innerText = "Aciertos: " + aciertos + " / 10 (Mínimo 7)";
  }

  function updateLives() {
    let h = "";
    for(let i = 0; i < lives; i++) h += "❤️";
    document.getElementById('lives').innerText = "Vidas: " + h;
  }

  function update() {
    if (gameOver || gameWon || isPaused) return;

    if (invulnerableTimer > 0) invulnerableTimer--;

    if (keys.right) player.x += player.speed;
    if (keys.left && player.x > 0) player.x -= player.speed;

    player.vy += player.gravity;
    player.y += player.vy;

    player.jumping = true;
    platforms.forEach(function(p) {
      if (
        player.x < p.x + p.width &&
        player.x + player.width > p.x &&
        player.y + player.height > p.y &&
        player.y + player.height - player.vy <= p.y
      ) {
        player.y = p.y - player.height;
        player.vy = 0;
        player.jumping = false;
      }
    });

    questions.forEach(function(q) {
      if (q.type === 'coin' && !q.collected) {
        if (
          player.x < q.x + 24 &&
          player.x + player.width > q.x &&
          player.y < q.y + 24 &&
          player.y + player.height > q.y
        ) {
          triggerQuiz(q);
        }
      } else if (q.type === 'enemy' && !q.defeated) {
        q.x += q.vx;
        if (q.x < q.minX || q.x > q.maxX) q.vx *= -1;

        if (
          player.x < q.x + q.width &&
          player.x + player.width > q.x &&
          player.y < q.y + q.height &&
          player.y + player.height > q.y
        ) {
          if (player.vy > 0 && player.y + player.height - player.vy <= q.y + 14) {
            player.vy = -8;
            triggerQuiz(q);
          } else {
            takeDamage();
          }
        }
      }
    });

    if (
      player.x < goal.x + goal.width &&
      player.x + player.width > goal.x &&
      player.y < goal.y + goal.height &&
      player.y + player.height > goal.y
    ) {
      if (aciertos >= 7) {
        gameWon = true;
      } else {
        message = "¡Requieres al menos 7 aciertos (70%) para ingresar a la Clínica FACMED!";
      }
    }

    cameraX = player.x - 200;
    if (cameraX < 0) cameraX = 0;
  }

  function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    ctx.save();
    ctx.translate(-cameraX, 0);

    platforms.forEach(function(p) {
      ctx.fillStyle = "#8B4513";
      ctx.fillRect(p.x, p.y, p.width, p.height);
      ctx.fillStyle = "#4CAF50";
      ctx.fillRect(p.x, p.y, p.width, 6);

      if (p.label) {
        ctx.fillStyle = "#fff";
        ctx.font = "bold 13px Arial";
        ctx.fillText(p.label, p.x + 8, p.y + 16);
      }
    });

    questions.forEach(function(q) {
      if (q.type === 'coin' && !q.collected) {
        ctx.fillStyle = "#FFD700";
        ctx.beginPath();
        ctx.arc(q.x + 12, q.y + 12, 12, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = "#000";
        ctx.font = "bold 12px Arial";
        ctx.fillText("?", q.x + 8, q.y + 16);
      } else if (q.type === 'enemy' && !q.defeated) {
        ctx.fillStyle = "#D32F2F";
        ctx.beginPath();
        ctx.arc(q.x + 18, q.y + 18, 16, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = "#FF5252";
        for(let a = 0; a < Math.PI*2; a += Math.PI/4) {
          ctx.fillRect(q.x + 16 + Math.cos(a)*18, q.y + 16 + Math.sin(a)*18, 4, 4);
        }
        ctx.fillStyle = "#FFF";
        ctx.fillRect(q.x + 10, q.y + 12, 5, 5);
        ctx.fillRect(q.x + 22, q.y + 12, 5, 5);
        ctx.fillStyle = "#000";
        ctx.fillRect(q.x + 12, q.y + 14, 2, 2);
        ctx.fillRect(q.x + 24, q.y + 14, 2, 2);
      }
    });

    ctx.fillStyle = "#E0E0E0";
    ctx.fillRect(goal.x, goal.y, goal.width, goal.height);
    ctx.fillStyle = "#D32F2F";
    ctx.fillRect(goal.x + 30, goal.y + 15, 12, 35);
    ctx.fillRect(goal.x + 18, goal.y + 27, 36, 12);
    ctx.fillStyle = "#000";
    ctx.font = "bold 12px Arial";
    ctx.fillText("FACMED", goal.x + 10, goal.y + 75);

    if (invulnerableTimer % 6 < 3) {
      const px = player.x;
      const py = player.y;

      ctx.fillStyle = "#FFFFFF";
      ctx.fillRect(px + 6, py + 18, 24, 26);
      
      ctx.fillStyle = "#1976D2";
      ctx.fillRect(px + 8, py + 38, 9, 10);
      ctx.fillRect(px + 19, py + 38, 9, 10);

      ctx.fillStyle = "#FFCC80";
      ctx.beginPath();
      ctx.arc(px + 18, py + 12, 11, 0, Math.PI * 2);
      ctx.fill();

      ctx.fillStyle = "#4CAF50";
      ctx.beginPath();
      ctx.arc(px + 18, py + 8, 11, Math.PI, Math.PI * 2);
      ctx.fill();
      ctx.fillRect(px + 7, py + 6, 22, 4);

      ctx.fillStyle = "#333";
      ctx.beginPath();
      ctx.arc(px + 14, py + 11, 2, 0, Math.PI * 2);
      ctx.arc(px + 22, py + 11, 2, 0, Math.PI * 2);
      ctx.fill();

      ctx.strokeStyle = "#333";
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      ctx.arc(px + 18, py + 13, 4, 0.1 * Math.PI, 0.9 * Math.PI);
      ctx.stroke();

      ctx.strokeStyle = "#000";
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.arc(px + 18, py + 24, 6, 0, Math.PI);
      ctx.stroke();
      ctx.fillStyle = "#FFD700";
      ctx.beginPath();
      ctx.arc(px + 18, py + 30, 3, 0, Math.PI * 2);
      ctx.fill();
    }

    ctx.restore();

    if (message && !isPaused) {
      ctx.fillStyle = "rgba(0, 0, 0, 0.85)";
      ctx.fillRect(10, 340, 780, 45);
      ctx.fillStyle = "#FFF";
      ctx.font = "bold 15px Arial";
      ctx.fillText(message, 20, 368);
    }

    if (gameOver) {
      ctx.fillStyle = "rgba(0, 0, 0, 0.9)";
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      ctx.fillStyle = "#FF5252";
      ctx.font = "bold 30px Arial";
      ctx.fillText("¡EXAMEN REPROBADO!", 230, 180);
      ctx.font = "16px Arial";
      ctx.fillStyle = "#FFF";
      ctx.fillText("Agotaste tus vidas. Recarga para repasar el temario de nuevo.", 160, 230);
    } else if (gameWon) {
      ctx.fillStyle = "rgba(0, 80, 0, 0.92)";
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      ctx.fillStyle = "#FFD700";
      ctx.font = "bold 30px Arial";
      ctx.fillText("¡APROBASTE SALUD PÚBLICA!", 180, 170);
      ctx.font = "18px Arial";
      ctx.fillStyle = "#FFF";
      ctx.fillText("Obtuviste " + aciertos + " / 10 aciertos (Aprobado >= 7).", 220, 220);
      ctx.font = "15px Arial";
      ctx.fillText("¡Has integrado con éxito los Temas 1 y 2 del programa de la FacMed!", 150, 260);
    }
  }

  function gameLoop() {
    update();
    draw();
    requestAnimationFrame(gameLoop);
  }

  gameLoop();
};
</script>
</body>
</html>
